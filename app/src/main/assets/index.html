<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09111f"><title>VPN WORLD 6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#eef4ff;font-family:Arial,sans-serif;padding:18px}
header{text-align:center;padding:22px 8px}.logo{font-size:42px}h1{margin:8px 0;color:#66a6ff}p{color:#9fb0c8}
button{border:0;border-radius:12px;padding:13px 18px;background:#2678ef;color:white;font-weight:bold;font-size:15px}
#status{margin:12px 0;color:#9fb0c8;text-align:center}.server{background:#121f33;border:1px solid #233754;border-radius:15px;padding:15px;margin:12px 0}
.server h3{margin:0 0 8px}.meta{font-size:13px;color:#a9bad1;line-height:1.8}.server button{margin-top:10px}
.toolbar{display:flex;gap:8px}.toolbar button{flex:1}input{width:100%;padding:12px;border-radius:10px;border:1px solid #304664;background:#101c2e;color:white;margin:12px 0}
small{color:#8398b5}
</style></head>
<body>
<header><div class="logo">🌐</div><h1>VPN WORLD 6</h1><p>قائمة خوادم VPN Gate المتاحة</p><div class="toolbar"><button onclick="refresh()">بحث عن الخوادم</button><button onclick="sortServers()">ترتيب حسب Ping</button></div></header>
<div id="status">جارٍ بدء البحث عن الخوادم...</div>
<input id="filter" placeholder="ابحث عن دولة أو عنوان IP..." oninput="render()">
<main id="servers"></main>
<footer><small>الخوادم مقدمة من VPN Gate وقد تتوقف أو تتغير سرعتها. حفظ ملف الإعداد لا يعني أن الاتصال قد تم.</small></footer>
<script>
let data=[];
function refresh(){document.getElementById('status').textContent='جارٍ البحث عن الخوادم...';document.getElementById('servers').innerHTML='';if(window.AndroidBridge)AndroidBridge.loadServers();else onServersError('افتح التطبيق على Android لتحميل الخوادم');}
function onServersLoaded(items){data=items||[];document.getElementById('status').textContent='تم العثور على '+data.length+' خادماً';render();}
function onServersError(msg){document.getElementById('status').textContent='تعذر تحميل الخوادم: '+msg;}
function render(){let q=document.getElementById('filter').value.toLowerCase();let root=document.getElementById('servers');root.innerHTML='';data.forEach((s,i)=>{if(!(s.country+' '+s.ip+' '+s.host).toLowerCase().includes(q))return;let el=document.createElement('section');el.className='server';let h=document.createElement('h3');h.textContent=(s.countryCode||'🌐')+' '+(s.country||'دولة غير معروفة');let m=document.createElement('div');m.className='meta';m.textContent='IP: '+s.ip+' · Ping: '+(s.ping||'?')+' ms · Score: '+(s.score||'?');let b=document.createElement('button');b.textContent='حفظ ملف إعداد OpenVPN';b.onclick=()=>AndroidBridge.saveConfig(i);el.append(h,m,b);root.appendChild(el);});}
function sortServers(){data.sort((a,b)=>(Number(a.ping)||999999)-(Number(b.ping)||999999));render();}
window.onServersLoaded=onServersLoaded;window.onServersError=onServersError;
window.onload=refresh;
</script></body></html>
